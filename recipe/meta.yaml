{% set version = "2.0.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-urlchecker
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/urlchecker_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/urlchecker/urlchecker_{{ version }}.tar.gz
  sha256: 7a9e6137ded1c5be5d927e0ac91cb84a8922d37ece5757330f7f0d258e15378d

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-cli
    - r-curl
    - r-gitcreds
    - r-rlang >=1.1.0
    - r-xml2
  run:
    - r-base
    - r-cli
    - r-curl
    - r-gitcreds
    - r-rlang >=1.1.0
    - r-xml2

test:
  commands:
    - $R -e "library('urlchecker')"           # [not win]
    - "\"%R%\" -e \"library('urlchecker')\""  # [win]

about:
  home: https://github.com/r-lib/urlchecker
  doc_url: https://urlchecker.r-lib.org/
  license: GPL-3.0-only
  summary: Provide the URL checking tools available in R 4.1+ as a package for earlier versions of R. Also uses concurrent requests so can be much faster than the serial versions.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
